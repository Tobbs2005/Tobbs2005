name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svgs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ef8a7c&color_dots=#161b22,#4b4370,#8b84d4,#e6a3b8,#f4b9a7
            dist/snake-light.svg?palette=github-light&color_snake=#ef8a7c&color_dots=#f3e6d6,#d6d1f0,#b3acdf,#e6b3c4,#7cc7c1

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
