name: skyline

# retired: the README no longer has a 3D skyline. Kept for manual use only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch contributions
        run: node scripts/fetch-contributions.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
      - name: rebuild the 3D skyline in the README
        run: python3 scripts/skyline.py
      - name: commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/data.json
          git diff --cached --quiet || git commit -m "Update contribution skyline" && git push
